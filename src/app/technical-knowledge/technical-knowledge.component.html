<div class="skills-section">
  <span class="skills-watermark" aria-hidden="true">03</span>

  <div class="section-inner skills-inner">

    <div class="section-header">
      <p class="section-label">competências</p>
      <h2 class="section-heading">Habilidades Técnicas</h2>
      <div class="section-divider"></div>
    </div>

    <!-- Skill groups -->
    <div class="skills-grid">
      <div
        class="skill-group"
        *ngFor="let group of skillGroups"
        [class]="'skill-group--' + group.color"
      >
        <div class="group-header">
          <div class="group-dot" [class]="'dot--' + group.color"></div>
          <span class="group-label">{{ group.label }}</span>
        </div>
        <div class="group-tags">
          <span
            class="skill-tag"
            [class]="'tag--' + group.color"
            *ngFor="let skill of group.skills"
          >{{ skill }}</span>
        </div>
      </div>
    </div>

    <!-- Certifications -->
    <div class="certs-section">
      <h3 class="subsection-heading">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
        Certificações
      </h3>
      <div class="certs-list">
        <div
          class="cert-card"
          *ngFor="let cert of certifications"
          [class.clickable]="cert.url"
          (click)="openCert(cert.url)"
          [attr.role]="cert.url ? 'button' : null"
          [attr.tabindex]="cert.url ? 0 : null"
          (keydown.enter)="openCert(cert.url)"
        >
          <div class="cert-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="cert-info">
            <span class="cert-name">{{ cert.name }}</span>
            <span class="cert-issuer">{{ cert.issuer }}</span>
          </div>
          <svg *ngIf="cert.url" class="cert-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Soft skills -->
    <div class="soft-section">
      <h3 class="subsection-heading">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Soft Skills
      </h3>
      <div class="soft-tags">
        <span class="soft-tag" *ngFor="let s of softSkills">{{ s }}</span>
      </div>
    </div>

  </div>
</div>
